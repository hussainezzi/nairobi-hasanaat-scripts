<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <style>
    @font-face {
        font-family: 'Kanz Al Marjaan';
        src: url('https://res.cloudinary.com/dmukvplh6/raw/upload/v1763627530/Kanz-al-Marjaan_g3jfoy.ttf') format('truetype');
    }
    body { background: #f4f7f6; padding: 20px; font-family: 'Segoe UI', sans-serif; }
    .kanz-font { font-family: 'Kanz Al Marjaan', serif; font-size: 1.8rem; line-height: 1; }
    .arabic-title { font-family: 'Kanz Al Marjaan'; font-size: 2.8rem; color: #0d6efd; text-align: center; line-height: 1.1; }
    .card-stat { border: none; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    .border-tashjee { border-top: 5px solid #198754; }
    .border-tanbeeh { border-top: 5px solid #dc3545; }
    .border-hasanaat { border-top: 5px solid #0d6efd; background: #f0f7ff; }
    
    /* New style for the Hizb badge */
    .hizb-badge { 
      font-size: 0.85rem; 
      background: #6f42c1; 
      color: white; 
      padding: 4px 12px; 
      border-radius: 20px; 
      display: inline-block;
      margin-top: 5px;
    }
  </style>
</head>
<body>
  <div class="container" style="max-width: 650px;">
    <div class="card p-4 shadow-sm mb-4 text-center border-0">
      <img src="https://res.cloudinary.com/de0cllasz/image/upload/v1767414895/MSB_logo_jvw3yw.png" style="width:80px; margin:auto; margin-bottom: 10px;">
      <h1 class="arabic-title">هكذا تجتمع الحسنات</h1>
      <h5 class="text-muted fw-bold">Hasanaat Portal</h5>
      <div class="input-group mt-3 shadow-sm">
        <input type="text" id="searchIts" class="form-control" placeholder="Enter ITS Number">
        <button onclick="searchLogs()" id="searchBtn" class="btn btn-primary px-4">Search</button>
      </div>
      <div class="mt-3">
         <a href="<?= ScriptApp.getService().getUrl() ?>" class="text-decoration-none small">← Back to Data Entry</a>
      </div>
    </div>

    <div id="resultArea" style="display:none;">
      <div class="card p-3 mb-3 text-center shadow-sm border-0">
        <small class="text-muted text-uppercase fw-bold">Student Record</small>
        <h3 id="displayName" class="mb-0 text-dark">---</h3>
        <div id="displayHizb" class="hizb-badge">---</div>
      </div>

      <div class="row g-2 mb-4">
        <div class="col-4">
          <div class="card card-stat border-tashjee p-2 text-center">
            <div class="kanz-font text-success">تشجيع</div>
            <h2 id="posPoints" class="m-0 text-success fw-bold">0</h2>
          </div>
        </div>
        <div class="col-4">
          <div class="card card-stat border-tanbeeh p-2 text-center">
            <div class="kanz-font text-danger">تنبيه</div>
            <h2 id="negPoints" class="m-0 text-danger fw-bold">0</h2>
          </div>
        </div>
        <div class="col-4">
          <div class="card card-stat border-hasanaat p-2 text-center">
            <div class="kanz-font text-primary">حسنات</div>
            <h2 id="totalCredit" class="m-0 text-primary fw-bold">0</h2>
          </div>
        </div>
      </div>

      <div class="card p-2 shadow-sm border-0">
        <table class="table table-sm table-hover mt-2">
          <thead class="table-light">
            <tr><th>Date</th><th>Activity</th><th>Points</th></tr>
          </thead>
          <tbody id="logTable" style="font-size: 0.9rem;"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    function searchLogs() {
      const its = document.getElementById('searchIts').value;
      if(!its) return;
      
      const btn = document.getElementById('searchBtn');
      btn.innerText = "...";
      btn.disabled = true;

      google.script.run.withSuccessHandler(data => {
        btn.innerText = "Search";
        btn.disabled = false;

        if(!data || data.logs.length === 0) { 
          alert("No records found for this ITS."); 
          document.getElementById('resultArea').style.display = "none";
          return; 
        }

        document.getElementById('resultArea').style.display = "block";
        document.getElementById('displayName').innerText = data.studentName;
        
        // Update the Hizb display
        document.getElementById('displayHizb').innerText = "Hizb: " + (data.hizb || "General");
        
        document.getElementById('posPoints').innerText = "+" + data.pos;
        document.getElementById('negPoints').innerText = "-" + data.neg;
        document.getElementById('totalCredit').innerText = data.totalCredit;

        let html = "";
        data.logs.forEach(row => {
          let badge = row.points > 0 ? 'bg-success' : 'bg-danger';
          html += `<tr>
                    <td>${row.dateTime}</td>
                    <td>${row.action}</td>
                    <td><span class="badge ${badge}">${row.points}</span></td>
                   </tr>`;
        });
        document.getElementById('logTable').innerHTML = html;
      }).getStudentLogs(its);
    }
  </script>
</body>
</html>
