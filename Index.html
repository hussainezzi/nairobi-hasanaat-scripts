<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <style>
    /* Custom font for Arabic titles */
    @font-face {
        font-family: 'Kanz Al Marjaan';
        src: url('https://res.cloudinary.com/dmukvplh6/raw/upload/v1763627530/Kanz-al-Marjaan_g3jfoy.ttf') format('truetype');
        font-weight: normal; font-style: normal; font-display: swap;
    }

    body { background: #f4f7f6; padding: 20px; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    .card { border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 650px; margin: auto; border: none; }
    .logo { width: 100px; display: block; margin: 0 auto 10px; }
    
    .kanz-header { 
        font-family: 'Kanz Al Marjaan', serif; 
        font-size: 3.2rem; 
        color: #0d6efd; 
        text-align: center; 
        line-height: 1.1;
        margin-bottom: 0;
    }
    .sub-title { text-align: center; color: #6c757d; margin-bottom: 25px; font-weight: 600; }

    .action-container { display: flex; gap: 15px; margin-bottom: 1.5rem; }
    .action-box { flex: 1; padding: 15px; border-radius: 12px; }
    .bg-tashjee { background-color: #e8f5e9; border: 2px solid #2e7d32; }
    .bg-tanbeeh { background-color: #ffebee; border: 2px solid #c62828; }
    
    .kanz-label { font-family: 'Kanz Al Marjaan', serif; font-size: 1.8rem; display: block; text-align: center; margin-bottom: 5px; line-height: 1; }
    .text-tashjee { color: #2e7d32; }
    .text-tanbeeh { color: #c62828; }

    #previewContainer img { width: 120px; border-radius: 10px; border: 2px solid #3498db; margin-top: 10px; }
    .student-chip { background-color: #001f3f; color: #ffffff; border-radius: 20px; padding: 6px 14px; font-size: 0.9rem; font-weight: 600; display: inline-flex; align-items: center; gap: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.15); }
    .student-chip .close-btn { cursor: pointer; background: rgba(255,255,255,0.2); border-radius: 50%; width: 18px; height: 18px; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; line-height: 1; }
    .student-chip .close-btn:hover { background: #ef4444; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card p-4">
      <img src="https://res.cloudinary.com/de0cllasz/image/upload/v1771157375/nairobi-removebg-preview_kuxmjp.png" class="logo">
      <h1 class="kanz-header">هكذا تجتمع الحسنات</h1>
      <div class="sub-title">Hasanaat Entry Portal</div>
      
      <!-- Passcode Verification -->
      <div class="mb-3">
        <label class="form-label fw-bold">Teacher Passcode</label>
        <div class="input-group">
          <input type="password" id="passId" class="form-control" placeholder="Enter Secret ID" onkeyup="if(event.key==='Enter') verifyPasscode()">
          <button class="btn btn-primary fw-bold" type="button" id="verifyBtn" onclick="verifyPasscode()">Verify</button>
        </div>
        <div id="passStatus" class="mt-2"></div>
      </div>

      <!-- Student Selection (Protected & Multi-Select) -->
      <div class="mb-3">
        <label class="form-label fw-bold">Select Student(s)</label>
        <div class="input-group mb-2">
          <input list="students" id="studentInput" class="form-control" placeholder="🔒 Enter Teacher Passcode first..." disabled onchange="addSelectedStudent()">
          <button class="btn btn-outline-primary fw-bold" type="button" id="addStudentBtn" onclick="addSelectedStudent()" disabled>+ Add Student</button>
        </div>
        <datalist id="students"></datalist>
        <div id="selectedStudentsContainer" class="d-flex flex-wrap gap-2 mt-2"></div>
      </div>

      <!-- Action Selection -->
      <div class="action-container">
        <div class="action-box bg-tashjee">
          <label class="kanz-label text-tashjee">تشجيع</label>
          <select id="posSelect" class="form-select" onchange="selectAction('pos')" disabled>
            <option value="" selected disabled>Select Positive...</option>
          </select>
        </div>
        <div class="action-box bg-tanbeeh">
          <label class="kanz-label text-tanbeeh">تنبيه</label>
          <select id="negSelect" class="form-select" onchange="selectAction('neg')" disabled>
            <option value="" selected disabled>Select Negative...</option>
          </select>
        </div>
      </div>
      
      <div class="row mb-3">
        <div class="col-8">
          <label class="form-label small fw-bold text-muted">Selected Action</label>
          <input type="text" id="finalAction" class="form-control bg-light" readonly>
        </div>
        <div class="col-4">
          <label class="form-label small fw-bold text-muted">Points (Max 5)</label>
          <input type="number" id="points" class="form-control" min="-5" max="5" oninput="validatePoints(this)" disabled>
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label fw-bold">Picture (Optional Evidence)</label>
        <input type="file" id="evidencePhoto" class="form-control" accept="image/*" onchange="previewImage(this)" disabled>
        <div id="previewContainer" class="mt-2 text-center" style="display:none;">
          <img id="imgPreview" src="">
          <button type="button" class="btn btn-sm btn-link text-danger d-block mx-auto mt-1" onclick="removeImage()">Remove Picture</button>
        </div>
      </div>

      <textarea id="comments" class="form-control mb-3" placeholder="Add optional comments here..." disabled></textarea>
      
      <div id="notificationToggleArea" style="display: none;" class="mt-3">
        <div class="form-check p-3 border rounded bg-light">
          <input class="form-check-input" type="checkbox" id="notifyParent">
          <label class="form-check-label text-danger" for="notifyParent">
            <b>Notify Parents Immediately?</b> (Mandatory for serious issues)
          </label>
        </div>
      </div>

      <button onclick="submitForm()" id="submitBtn" class="btn btn-primary w-100 fw-bold py-2" disabled>Submit Log & Notify</button>
      
      <div class="text-center mt-3">
        <a href="<?= ScriptApp.getService().getUrl() ?>?page=LogView" class="text-decoration-none small me-3">View Student History →</a>
        <a href="<?= ScriptApp.getService().getUrl() ?>?page=Attendance" class="text-decoration-none small">Take Attendance →</a>
      </div>
    </div>
  </div>

<script>
    let verifiedTeacher = null;
    let selectedStudents = [];

    /**
     * INITIALIZATION: Load Actions only on load. Student list is NOT loaded until passcode is verified.
     */
    window.onload = () => {
      google.script.run.withSuccessHandler(actions => {
        let posSel = document.getElementById('posSelect');
        let negSel = document.getElementById('negSelect');
        actions.forEach(a => {
          let opt = document.createElement('option');
          opt.value = a[1]; opt.text = a[0];
          if (Number(a[1]) >= 0) posSel.add(opt); else negSel.add(opt);
        });
      }).getActions();
    };

    /**
     * SECURITY: Verify Teacher Passcode before revealing student details
     */
    function verifyPasscode() {
      const passInput = document.getElementById('passId');
      const passId = passInput.value.trim();
      const statusDiv = document.getElementById('passStatus');
      const verifyBtn = document.getElementById('verifyBtn');

      if (!passId) {
        statusDiv.innerHTML = '<span class="text-danger small fw-bold">Please enter passcode.</span>';
        return;
      }

      verifyBtn.disabled = true;
      verifyBtn.innerHTML = '<span class="spinner-border spinner-border-sm"></span>';

      google.script.run
        .withSuccessHandler(res => {
          verifyBtn.disabled = false;
          verifyBtn.innerHTML = 'Verify';

          if (res && res.success) {
            verifiedTeacher = { passId: passId, name: res.name };
            statusDiv.innerHTML = `<span class="badge bg-success p-2">✓ Verified Teacher: ${res.name}</span> <button class="btn btn-sm btn-link text-danger p-0 ms-2 text-decoration-none" onclick="lockPortal()">Logout</button>`;
            passInput.disabled = true;
            verifyBtn.style.display = 'none';

            // Fetch and unlock student list securely
            loadStudentList();
          } else {
            lockPortal();
            statusDiv.innerHTML = '<span class="badge bg-danger p-2">❌ Invalid Passcode</span>';
          }
        })
        .withFailureHandler(err => {
          verifyBtn.disabled = false;
          verifyBtn.innerHTML = 'Verify';
          statusDiv.innerHTML = `<span class="text-danger small fw-bold">Error: ${err.message}</span>`;
        })
        .verifyTeacher(passId);
    }

    function loadStudentList() {
      const studentInput = document.getElementById('studentInput');
      studentInput.placeholder = "⏳ Loading student roster...";

      google.script.run.withSuccessHandler(list => {
        let dl = document.getElementById('students');
        dl.innerHTML = '';
        list.forEach(s => {
          let opt = document.createElement('option');
          opt.value = s.its;
          opt.setAttribute('data-hizb', s.hizb || "General"); 
          opt.text = `${s.name} (Class: ${s.class} ${s.section})`;
          dl.appendChild(opt);
        });

        studentInput.disabled = false;
        document.getElementById('addStudentBtn').disabled = false;
        studentInput.placeholder = "Type ITS or Name...";
        enableFormControls(true);
      }).getStudentList();
    }

    function lockPortal() {
      verifiedTeacher = null;
      selectedStudents = [];
      renderSelectedStudents();
      document.getElementById('students').innerHTML = '';
      
      const passInput = document.getElementById('passId');
      passInput.disabled = false;
      passInput.value = '';
      document.getElementById('verifyBtn').style.display = 'inline-block';
      document.getElementById('passStatus').innerHTML = '';

      const studentInput = document.getElementById('studentInput');
      studentInput.value = '';
      studentInput.disabled = true;
      document.getElementById('addStudentBtn').disabled = true;
      studentInput.placeholder = "🔒 Enter Teacher Passcode first...";

      enableFormControls(false);
    }

    function enableFormControls(enable) {
      document.getElementById('posSelect').disabled = !enable;
      document.getElementById('negSelect').disabled = !enable;
      document.getElementById('points').disabled = !enable;
      document.getElementById('evidencePhoto').disabled = !enable;
      document.getElementById('comments').disabled = !enable;
      document.getElementById('submitBtn').disabled = !enable;
    }

    /**
     * MULTI-STUDENT SELECTION LOGIC
     */
    function addSelectedStudent() {
      const input = document.getElementById('studentInput');
      const val = input.value.trim();
      if (!val) return;

      const dl = document.getElementById('students');
      const option = Array.from(dl.options).find(opt => opt.value === val || opt.text.toLowerCase().includes(val.toLowerCase()));

      if (!option) {
        alert("Please select a valid student from the dropdown list.");
        return;
      }

      const its = option.value;
      if (selectedStudents.some(s => s.its === its)) {
        input.value = '';
        return;
      }

      const studentFullName = option.text.split(" (")[0];
      const studentHizb = option.getAttribute('data-hizb') || "General";
      
      let classOnly = "";
      let section = "";
      try {
        classOnly = option.text.split("Class: ")[1].split(" ")[0];
        section = option.text.split(" ").pop().replace(")", "");
      } catch(e) { console.error("Parsing error", e); }

      selectedStudents.push({
        its: its,
        name: studentFullName,
        classOnly: classOnly,
        section: section,
        hizb: studentHizb
      });

      input.value = '';
      renderSelectedStudents();
    }

    function removeSelectedStudent(its) {
      selectedStudents = selectedStudents.filter(s => s.its !== its);
      renderSelectedStudents();
    }

    function renderSelectedStudents() {
      const container = document.getElementById('selectedStudentsContainer');
      container.innerHTML = '';
      selectedStudents.forEach(s => {
        const chip = document.createElement('div');
        chip.className = 'student-chip';
        chip.innerHTML = `
          <span>👤 ${s.name} (${s.classOnly} ${s.section})</span>
          <span class="close-btn" onclick="removeSelectedStudent('${s.its}')">✕</span>
        `;
        container.appendChild(chip);
      });
    }

    /**
     * UI LOGIC: Action & Points Selection
     */
    function selectAction(type) {
      const posSel = document.getElementById('posSelect');
      const negSel = document.getElementById('negSelect');
      const pointsInput = document.getElementById('points');
      const notifyArea = document.getElementById('notificationToggleArea');
      
      let selectedPoints = 0;
      let actionName = "";

      if (type === 'pos') {
        negSel.selectedIndex = 0;
        actionName = posSel.selectedOptions[0].text;
        selectedPoints = Number(posSel.value);
      } else {
        posSel.selectedIndex = 0;
        actionName = negSel.selectedOptions[0].text;
        selectedPoints = Number(negSel.value);
      }

      document.getElementById('finalAction').value = actionName;
      pointsInput.value = selectedPoints;

      notifyArea.style.display = "block"; 
      
      const notifyLabel = document.querySelector('label[for="notifyParent"]');
      if (selectedPoints > 0) {
        notifyLabel.innerHTML = "<b>Send 'Golden Moment' Email to Parents?</b>";
        notifyLabel.className = "form-check-label text-success";
        document.getElementById('notifyParent').checked = true;
      } else {
        notifyLabel.innerHTML = "<b>Notify Parents Immediately?</b> (Only mandatory for serious issues)";
        notifyLabel.className = "form-check-label text-danger";
        document.getElementById('notifyParent').checked = false;
      }
    }

    function validatePoints(input) {
      let val = Number(input.value);
      if (val > 5) input.value = 5;
      if (val < -5) input.value = -5;
    }

    function previewImage(input) {
      const preview = document.getElementById('imgPreview');
      const container = document.getElementById('previewContainer');
      if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = (e) => {
          preview.src = e.target.result;
          container.style.display = 'block';
        };
        reader.readAsDataURL(input.files[0]);
      }
    }

    function removeImage() {
      document.getElementById('evidencePhoto').value = "";
      document.getElementById('previewContainer').style.display = 'none';
    }

    /**
     * FORM SUBMISSION LOGIC (Supports Single & Multi-Student Batch Submission)
     */
    function submitForm() {
      if (!verifiedTeacher) {
        alert("Security Error: Please verify your Teacher Passcode first.");
        return;
      }

      // If user typed in studentInput without clicking +Add, try auto-adding
      if (document.getElementById('studentInput').value.trim()) {
        addSelectedStudent();
      }

      if (selectedStudents.length === 0) {
        alert("Please select at least one student.");
        return;
      }

      const action = document.getElementById('finalAction').value;
      if (!action) { 
        alert("Please select an action."); 
        return; 
      }

      const fileInput = document.getElementById('evidencePhoto');
      const btn = document.getElementById('submitBtn');

      const commonData = {
        action: action,
        points: document.getElementById('points').value,
        comments: document.getElementById('comments').value,
        teacher: verifiedTeacher.name,
        notifyParent: document.getElementById('notifyParent').checked,
        photoData: null
      };

      btn.disabled = true;
      btn.innerHTML = `<span class="spinner-border spinner-border-sm"></span> Processing Submission for ${selectedStudents.length} Student(s)...`;

      const batchPayload = {
        students: selectedStudents,
        common: commonData
      };

      if (fileInput.files && fileInput.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) {
          batchPayload.common.photoData = e.target.result;
          saveBatchLogToServer(batchPayload);
        };
        reader.readAsDataURL(fileInput.files[0]);
      } else {
        saveBatchLogToServer(batchPayload);
      }
    }

    function saveBatchLogToServer(batchPayload) {
      google.script.run
        .withSuccessHandler((response) => {
          if (response && response.toString().startsWith("Error")) {
            alert(response);
            resetSubmitButton();
          } else {
            alert(`✅ ${response}`);
            resetFormAfterSubmission();
          }
        })
        .withFailureHandler(err => {
          alert("Submission Failed: " + err.message);
          resetSubmitButton();
        })
        .submitBatchLogs(batchPayload);
    }

    function resetFormAfterSubmission() {
      selectedStudents = [];
      renderSelectedStudents();
      document.getElementById('studentInput').value = '';
      document.getElementById('posSelect').selectedIndex = 0;
      document.getElementById('negSelect').selectedIndex = 0;
      document.getElementById('finalAction').value = '';
      document.getElementById('points').value = '';
      document.getElementById('evidencePhoto').value = '';
      removeImage();
      document.getElementById('comments').value = '';
      document.getElementById('notifyParent').checked = false;
      document.getElementById('notificationToggleArea').style.display = 'none';

      resetSubmitButton();
    }

    function resetSubmitButton() {
      const btn = document.getElementById('submitBtn');
      btn.disabled = false;
      btn.innerHTML = "Submit Log & Notify";
    }
</script>
</body>
</html>
